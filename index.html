<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Blast - Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1f38;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    header {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 15px;
      position: relative;
    }

    .btn-adm {
      position: absolute;
      right: 0;
      top: 0;
      background: #33395c;
      color: #aaa;
      border: 1px solid #4a517a;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .saldo-container {
      margin-top: 10px;
      text-align: center;
    }

    .saldo-valor {
      font-size: 36px;
      font-weight: 800;
      color: #25d366;
      text-shadow: 0 2px 10px rgba(37, 211, 102, 0.3);
    }

    /* Tabuleiro 8x8 */
    #tabuleiro {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 3px;
      width: 100%;
      max-width: 360px;
      height: 360px;
      background-color: #121526;
      padding: 6px;
      border-radius: 12px;
      border: 2px solid #2a3052;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      position: relative;
    }

    .celula {
      background-color: #1c223d;
      border-radius: 4px;
    }

    .celula.ocupada-amarelo { background-color: #f1c40f; }
    .celula.ocupada-azul { background-color: #3498db; }
    .celula.ocupada-verde { background-color: #2ecc71; }

    /* Bandeja de Peças */
    .bandeja {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      max-width: 360px;
      height: 100px;
      margin-top: 15px;
      background-color: #121526;
      border-radius: 12px;
      padding: 10px;
    }

    .peca-slot {
      cursor: pointer;
    }

    /* Botão Amarelo de Feedbacks */
    .btn-feedback-amarelo {
      width: 100%;
      max-width: 360px;
      margin-top: 15px;
      padding: 12px;
      background-color: #f1c40f;
      color: #1a1f38;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(241, 196, 15, 0.3);
    }

    /* Animação Texto Ganho */
    @keyframes flutuarTexto {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-40px) scale(1); }
    }

    .texto-ganho {
      position: absolute;
      color: #25d366;
      font-weight: 900;
      font-size: 22px;
      pointer-events: none;
      animation: flutuarTexto 0.9s ease-out forwards;
      z-index: 10;
    }

    /* Modais (Janelas Popups) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-conteudo {
      background: #1c223d;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 340px;
      color: #fff;
    }

    .modal-conteudo textarea {
      width: 100%;
      padding: 8px;
      background: #121526;
      border: 1px solid #2a3052;
      color: #fff;
      border-radius: 6px;
      resize: none;
      margin: 10px 0;
    }

    .btn-modal {
      width: 100%;
      padding: 8px;
      background: #25d366;
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <header>
    <button class="btn-adm" onclick="autenticarADM()">⚙️ ADM</button>
    <div class="saldo-container">
      <div class="saldo-valor"><span id="saldoEuro">0,00</span> €</div>
    </div>
  </header>

  <div id="tabuleiro"></div>

  <div class="bandeja">
    <div class="peca-slot" onclick="simularColocacaoPeca(this, 'amarelo')">
      <div style="display:grid; grid-template-columns: repeat(2, 16px); gap:2px;">
        <div style="width:16px;height:16px;background:#f1c40f;border-radius:2px;"></div>
        <div style="width:16px;height:16px;background:#f1c40f;border-radius:2px;"></div>
        <div style="width:16px;height:16px;background:#f1c40f;border-radius:2px;"></div>
        <div style="width:16px;height:16px;background:#f1c40f;border-radius:2px;"></div>
      </div>
    </div>

    <div class="peca-slot" onclick="simularColocacaoPeca(this, 'azul')">
      <div style="display:grid; grid-template-columns: repeat(2, 16px); gap:2px;">
        <div style="width:16px;height:16px;background:#3498db;border-radius:2px;"></div>
        <div style="width:16px;height:16px;background:transparent;"></div>
        <div style="width:16px;height:16px;background:#3498db;border-radius:2px;"></div>
        <div style="width:16px;height:16px;background:#3498db;border-radius:2px;"></div>
      </div>
    </div>

    <div class="peca-slot" onclick="simularColocacaoPeca(this, 'verde')">
      <div style="display:grid; grid-template-columns: repeat(3, 16px); gap:2px;">
        <div style="width:16px;height:16px;background:#2ecc71;border-radius:2px;"></div>
        <div style="width:16px;height:16px;background:#2ecc71;border-radius:2px;"></div>
        <div style="width:16px;height:16px;background:#2ecc71;border-radius:2px;"></div>
      </div>
    </div>
  </div>

  <button class="btn-feedback-amarelo" onclick="abrirModalFeedback()">💬 Feedbacks</button>

  <div id="modalFeedback" class="modal">
    <div class="modal-conteudo">
      <h3>Deixa o teu Feedback</h3>
      <textarea id="textoFeedback" rows="3" placeholder="Escreve aqui o teu comentário..."></textarea>
      <button class="btn-modal" onclick="enviarFeedback()">Enviar</button>
      <button class="btn-modal" style="background:#7f8c8d;" onclick="fecharModalFeedback()">Cancelar</button>
    </div>
  </div>

  <div id="modalADM" class="modal">
    <div class="modal-conteudo">
      <h3>📊 Painel ADM</h3>
      <p style="font-size: 12px; color: #aaa; margin: 8px 0;">Comentários dos jogadores:</p>
      <div id="listaMensagens" style="max-height: 180px; overflow-y: auto; margin-bottom: 12px;"></div>
      <button onclick="limparFeedbacks()" style="background:#e74c3c; color:#fff; border:none; padding:6px 10px; border-radius:4px; cursor:pointer;">Limpar Tudo</button>
      <button onclick="fecharADM()" style="background:#7f8c8d; color:#fff; border:none; padding:6px 10px; border-radius:4px; cursor:pointer;">Fechar</button>
    </div>
  </div>

  <script>
    let saldo = 0.00;
    const codigoADM = "davixx8067";
    const tabuleiro = document.getElementById('tabuleiro');

    function criarTabuleiro() {
      tabuleiro.innerHTML = '';
      for (let i = 0; i < 64; i++) {
        const celula = document.createElement('div');
        celula.classList.add('celula');
        tabuleiro.appendChild(celula);
      }
    }

    function simularColocacaoPeca(slot, cor) {
      const celulas = document.querySelectorAll('.celula');
      let pintados = 0;

      for (let i = 0; i < celulas.length && pintados < 3; i++) {
        const randIndex = Math.floor(Math.random() * 64);
        if (!celulas[randIndex].classList.contains(`ocupada-${cor}`)) {
          celulas[randIndex].classList.add(`ocupada-${cor}`);
          pintados++;
        }
      }

      const valorGanho = 6.25;
      saldo += valorGanho;
      document.getElementById('saldoEuro').innerText = saldo.toFixed(2).replace('.', ',');

      const rect = slot.getBoundingClientRect();
      mostrarEfeitoGanho(valorGanho, rect.left + 10, rect.top - 20);
    }

    function mostrarEfeitoGanho(valor, x, y) {
      const el = document.createElement('div');
      el.classList.add('texto-ganho');
      el.innerText = `+${valor.toFixed(2).replace('.', ',')} €`;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);

      setTimeout(() => el.remove(), 900);
    }

    /* Lógica do Modal de Feedback */
    function abrirModalFeedback() {
      document.getElementById('modalFeedback').style.display = 'flex';
    }

    function fecharModalFeedback() {
      document.getElementById('modalFeedback').style.display = 'none';
    }

    function enviarFeedback() {
      const txt = document.getElementById('textoFeedback').value.trim();
      if (!txt) return alert("Escreve algo antes de enviar!");

      let feedbacks = JSON.parse(localStorage.getItem('feedbacks_jogo')) || [];
      feedbacks.push({ texto: txt, hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
      localStorage.setItem('feedbacks_jogo', JSON.stringify(feedbacks));

      alert("Feedback enviado com sucesso!");
      document.getElementById('textoFeedback').value = '';
      fecharModalFeedback();
    }

    /* Lógica de Autenticação e Gestão do ADM */
    function autenticarADM() {
      const entrada = prompt("Insere a palavra-passe do ADM:");
      if (entrada === codigoADM) {
        abrirADM();
      } else if (entrada !== null) {
        alert("Código incorreto! Acesso negado.");
      }
    }

    function abrirADM() {
      const modal = document.getElementById('modalADM');
      const container = document.getElementById('listaMensagens');
      let feedbacks = JSON.parse(localStorage.getItem('feedbacks_jogo')) || [];

      container.innerHTML = feedbacks.length === 0 
        ? "<p style='font-size:12px; color:#666;'>Sem comentários ainda.</p>"
        : feedbacks.map((f, i) => `<div style='background:#121526; padding:6px; margin-bottom:5px; border-radius:4px; font-size:12px;'><strong>#${i+1} (${f.hora}):</strong><br>${f.texto}</div>`).join('');

      modal.style.display = 'flex';
    }

    function fecharADM() { document.getElementById('modalADM').style.display = 'none'; }
    function limparFeedbacks() { localStorage.removeItem('feedbacks_jogo'); abrirADM(); }

    criarTabuleiro();
  </script>
</body>
</html>
